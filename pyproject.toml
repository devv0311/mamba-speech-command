[project]
name = "mamba-speech-command"
version = "0.1.0"
description = "Real-time speech-command recognition using a compact Mamba (Selective State Space Model), evaluated against a GRU baseline, on Apple Silicon (MPS)."
requires-python = ">=3.10"
readme = "README.md"

[tool.setuptools.packages.find]
where = ["src"]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"
